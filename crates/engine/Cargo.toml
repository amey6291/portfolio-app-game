[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to match the installed wasm-bindgen CLI.
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
web-sys = { version = "=0.3.77", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlTemplateElement",
  "DocumentFragment", "Node", "NodeList", "DomRect", "DomTokenList",
  "CssStyleDeclaration", "DomStringMap", "Performance", "Event", "EventTarget",
  "KeyboardEvent", "FocusEvent", "ScrollToOptions", "ScrollBehavior",
] }
